<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="wrapper">
        <article class="flow">
          <h1>Grid stacking and <code>z-index</code></h1>
          <figure class="callout">
            <p>
              Toggle item one’s <code>z-index</code> to see how it affects
              stacking.
            </p>
          </figure>

          <div class="container" id="container">
            <div class="box">Item one</div>
            <div class="box">Item two</div>
            <div class="box">Item three</div>
            <div class="box">Item four</div>
            <div class="box">Item five</div>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
